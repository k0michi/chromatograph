name: CI

on:
  push:
    branches:
    - main
    paths:
    - 'backend/**.swift'
    - 'backend/**.yml'
    - 'frontend/**.ts'
    - 'frontend/**.tsx'
    - 'frontend/package.json'
    - 'frontend/package-lock.json'
    - '.github/workflows/ci.yml'
  pull_request:
    paths:
    - 'backend/**.swift'
    - 'backend/**.yml'
    - 'frontend/**.ts'
    - 'frontend/**.tsx'
    - 'frontend/package.json'
    - 'frontend/package-lock.json'
    - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - 'swift:latest'
    container:
      image: ${{ matrix.image }}
    defaults:
      run:
        working-directory: backend
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Test
      run: swift test

  frontend-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    - name: Install dependencies
      run: npm ci
    - name: Test
      run: npm test
    - name: Typecheck
      run: npm run typecheck
