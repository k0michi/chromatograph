services:
  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    expose:
      - "3000"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    expose:
      - "8080"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
